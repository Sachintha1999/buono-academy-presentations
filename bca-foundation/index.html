<title>BCA Foundation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#211d17;
    --ink-soft:#5a5445;
    --ink-faint:#8a8371;
    --paper:#faf7f0;
    --panel:#f1e9d9;
    --panel-2:#e8dec9;
    --line:#ddd0b3;
    --accent:#2f5d50;
    --accent-ink:#f3efe2;
    --accent-soft:#c7dbd2;
    --copper:#ab6c34;
    --copper-soft:#e9d3b6;
    --danger:#a5432f;
    --shadow: 0 18px 40px -22px rgba(33,29,23,0.35);
    --radius: 18px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; width:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', ui-sans-serif, system-ui, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces', ui-serif, Georgia, serif; text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; }
  ::selection{ background:var(--accent); color:var(--accent-ink); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }
  button{ font-family:inherit; touch-action:manipulation; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- shell ---------- */
  #topbar{
    position:fixed; top:0; left:0; right:0; height:4px; z-index:50;
    background:var(--line);
  }
  #topbar > i{
    display:block; height:100%; width:0%; background:var(--accent);
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  #rail{
    position:fixed; left:0; top:0; bottom:0; width:64px; height:100dvh; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; background:linear-gradient(180deg, transparent, var(--paper) 12%, var(--paper) 88%, transparent);
    border-right:1px solid var(--line);
  }
  .rail-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--ink-faint); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-size:13px; font-weight:600;
    transition:all .25s ease;
  }
  .rail-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .rail-btn.is-current{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); transform:scale(1.12); }
  .rail-btn.is-endpoint{ font-size:14px; }

  #stage{
    position:fixed; inset:0 0 0 64px; height:100dvh; width:calc(100% - 64px); overflow:hidden;
  }
  .slide{
    position:absolute; inset:0; height:100%; width:100%;
    display:flex; flex-direction:column; justify-content:center;
    padding: 2.1rem 5.4rem 5.2rem; box-sizing:border-box;
    opacity:0; transform:translateY(14px) scale(.995);
    pointer-events:none;
    transition:opacity .5s cubic-bezier(.4,0,.2,1), transform .5s cubic-bezier(.4,0,.2,1);
  }
  .slide.is-active{ opacity:1; transform:none; pointer-events:auto; }

  .slide .kicker, .slide .content > *{
    opacity:0; transform:translateY(16px) translate(var(--edx,0px), var(--edy,0px)) scale(var(--esc,1));
    transition:opacity .5s cubic-bezier(.4,0,.2,1), transform .5s cubic-bezier(.4,0,.2,1);
  }
  .slide.is-active .kicker, .slide.is-active .content > *{
    opacity:1; transform:translate(var(--edx,0px), var(--edy,0px)) scale(var(--esc,1));
  }
  .slide .kicker{ transition-delay:0s; }
  .slide .content > *:nth-child(1){ transition-delay:.1s; }
  .slide .content > *:nth-child(2){ transition-delay:.22s; }
  .slide .content > *:nth-child(3){ transition-delay:.34s; }
  .slide .content > *:nth-child(4){ transition-delay:.46s; }
  .slide .content > *:nth-child(5){ transition-delay:.58s; }
  .slide .content > *:nth-child(6){ transition-delay:.7s; }

  .kicker{
    display:flex; align-items:baseline; gap:.6rem; margin-bottom:1.1rem;
    font-family:'IBM Plex Mono'; font-size:.9rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--accent); font-weight:600;
  }
  .kicker .num{ color:var(--copper); }
  .kicker .sep{ color:var(--line); }
  .kicker .of{ color:var(--ink-faint); font-weight:500; text-transform:none; letter-spacing:0; }

  .content{ max-width:52rem; }
  .content.wide{ max-width:none; width:100%; }

  h2.title{ font-size:clamp(2.6rem, 4.8vw, 3.9rem); font-weight:600; line-height:1.08; margin-bottom:.9rem; }
  p.lede{ font-size:1.08rem; line-height:1.6; color:var(--ink-soft); max-width:38rem; margin-bottom:1.6rem; }

  ul.list{ list-style:none; margin:0; padding:0; display:grid; gap:.55rem; align-content:start; }
  ul.list.cherry-anim{ gap:.85rem; }
  ul.list.cherry-anim li{
    padding:1rem 1.3rem 1rem 1.5rem; background:var(--panel); border:1px solid var(--line);
    border-left:4px solid var(--copper); border-radius:10px; box-shadow:var(--shadow);
    font-size:1.28rem; line-height:1.4;
    opacity:0; transform:translateX(-18px); transition:opacity .5s ease, transform .5s ease;
  }
  ul.list.cherry-anim li::before{ display:none; }
  ul.list.cherry-anim b{ font-size:1.28rem; }
  .is-active ul.list.cherry-anim li:nth-child(1){ transition-delay:.15s; }
  .is-active ul.list.cherry-anim li:nth-child(2){ transition-delay:.35s; }
  .is-active ul.list.cherry-anim li:nth-child(3){ transition-delay:.55s; }
  .is-active ul.list.cherry-anim li:nth-child(4){ transition-delay:.75s; }
  .is-active ul.list.cherry-anim li:nth-child(5){ transition-delay:.95s; }
  .is-active ul.list.cherry-anim li:nth-child(6){ transition-delay:1.15s; }
  .is-active ul.list.cherry-anim li{ opacity:1; transform:none; }
  ul.list li{
    position:relative; padding-left:1.3rem; line-height:1.5; color:var(--ink);
    font-size:1rem;
  }
  ul.list li::before{
    content:''; position:absolute; left:0; top:.55em; width:6px; height:6px; border-radius:50%;
    background:var(--copper);
  }
  ul.list.tight li{ font-size:.95rem; }
  ul.list b{ color:var(--ink); }
  ul.list.numbered li{ padding-left:0; }
  ul.list.numbered li::before{ display:none; }
  .machine-diagram .mcallout{
    position:absolute; transform:translate(-50%,-50%);
    width:1.7rem; height:1.7rem; border-radius:50%;
    background:var(--accent); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-size:.8rem; font-weight:700;
    box-shadow:0 2px 6px rgba(0,0,0,.4); border:2px solid var(--paper);
  }
  ul.list.numbered .pn{
    display:inline-flex; align-items:center; justify-content:center; width:1.15rem; height:1.15rem;
    border-radius:50%; background:var(--accent); color:var(--paper); font-family:'IBM Plex Mono';
    font-size:.62rem; font-weight:700; margin-right:.45rem; vertical-align:middle;
  }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:2.2rem; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.4rem; }
  .grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:1.2rem; }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:1.3rem 1.4rem; box-shadow:var(--shadow);
  }
  .card h3{ font-size:1.05rem; font-weight:600; margin-bottom:.4rem; }
  .card .eyebrow{ font-family:'IBM Plex Mono'; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:.5rem; display:block; }

  .stat{
    font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums;
    font-size:1.9rem; font-weight:600; color:var(--accent); line-height:1;
  }
  .stat small{ display:block; font-family:'Work Sans'; font-size:.82rem; font-weight:500; color:var(--ink-faint); margin-top:.4rem; letter-spacing:.02em; }

  /* controls */
  #controls{
    position:fixed; left:64px; right:0; bottom:0; z-index:40; height:68px;
    display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:0 1.6rem;
    background:linear-gradient(0deg, var(--paper) 60%, transparent);
  }
  #controls .side{ display:flex; align-items:center; gap:.7rem; }
  .nav-btn{
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:1rem;
    display:flex; align-items:center; justify-content:center; transition:all .2s ease;
  }
  .nav-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .nav-btn:disabled{ opacity:.35; cursor:default; }
  #slidepos{ font-family:'IBM Plex Mono'; font-size:.95rem; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  #modulename{ font-family:'IBM Plex Mono'; font-size:.88rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
  #hint{ font-size:.86rem; color:var(--ink-faint); flex-shrink:0; }
  #hint kbd{ font-family:'IBM Plex Mono'; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:.05rem .35rem; }

  /* ============ diagram components ============ */

  /* gauge */
  .gauge-row{ display:flex; gap:2.6rem; flex-wrap:wrap; }
  .gauge{ display:flex; flex-direction:column; align-items:center; gap:.7rem; }
  .gauge .dial{
    --pct:0; width:140px; height:80px; position:relative; overflow:hidden;
  }
  .gauge .dial::before{
    content:''; position:absolute; inset:0 0 auto 0; width:140px; height:140px; border-radius:50%;
    background:conic-gradient(from 180deg, var(--accent) calc(var(--pct)*1%), var(--panel-2) 0);
    -webkit-mask:radial-gradient(closest-side, transparent 71%, #000 72%);
            mask:radial-gradient(closest-side, transparent 71%, #000 72%);
  }
  .gauge .needle{
    position:absolute; left:70px; bottom:0; width:2px; height:58px; background:var(--copper);
    transform-origin:bottom center; transform:rotate(0deg); border-radius:2px;
    transition:transform 1.1s cubic-bezier(.34,1.4,.4,1);
  }
  .gauge .hub{ position:absolute; left:64px; bottom:-6px; width:12px; height:12px; border-radius:50%; background:var(--copper); }
  .gauge .label{ font-family:'IBM Plex Mono'; font-size:.72rem; color:var(--ink-soft); text-align:center; }
  .gauge .label b{ display:block; color:var(--ink); font-size:.95rem; margin-top:.15rem; }

  /* thermometer */
  .therm-row{ display:flex; align-items:flex-end; gap:2.8rem; }
  .therm{ display:flex; flex-direction:column; align-items:center; gap:.7rem; }
  .therm .tube{
    width:22px; height:150px; border-radius:11px; background:var(--panel-2); position:relative;
    border:1px solid var(--line); overflow:hidden;
  }
  .therm .fill{
    position:absolute; left:0; right:0; bottom:0; height:0%;
    background:linear-gradient(180deg, var(--copper), var(--accent));
    transition:height 1.3s cubic-bezier(.4,0,.2,1);
  }
  .therm .bulb{ width:34px; height:34px; border-radius:50%; background:var(--copper); margin-top:-8px; position:relative; z-index:2; box-shadow:0 0 0 4px var(--paper); }
  .therm .label{ font-family:'IBM Plex Mono'; font-size:.78rem; text-align:center; color:var(--ink-soft); }
  .therm .label b{ display:block; color:var(--ink); font-size:1rem; }

  /* freshness chart */
  .chart-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:1.6rem 1.8rem; box-shadow:var(--shadow); }
  .chart-wrap svg{ width:100%; height:220px; display:block; }
  .chart-wrap .draw{ stroke-dasharray:600; stroke-dashoffset:600; transition:stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1) .1s; }
  .is-active .chart-wrap .draw{ stroke-dashoffset:0; }
  .chart-legend{ display:flex; gap:1.6rem; margin-top:.6rem; font-size:.8rem; color:var(--ink-soft); }
  .chart-legend span::before{ content:''; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:.4rem; vertical-align:middle; }
  .chart-legend .l1::before{ background:var(--accent); }
  .chart-legend .l2::before{ background:var(--copper); }

  /* bean compare */
  .photo-frame{ width:100%; object-fit:cover; display:block; border-radius:var(--radius); box-shadow:var(--shadow); }
  .kaldi-story{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; height:100%; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:1.6rem 1.2rem; }
  .kaldi-frame{ text-align:center; }
  .kaldi-icon{ font-size:2.6rem; line-height:1; margin-bottom:.5rem; display:inline-block; animation:kaldi-bounce 2.2s ease-in-out infinite; }
  .kaldi-frame.f2 .kaldi-icon{ animation-delay:.25s; }
  .kaldi-frame.f3 .kaldi-icon{ animation-delay:.5s; }
  @keyframes kaldi-bounce{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-7px) rotate(-4deg);} }
  .kaldi-frame p{ font-size:.82rem; color:var(--ink-soft); max-width:11rem; margin:0 auto; line-height:1.4; }
  .kaldi-arrow{ color:var(--copper); font-size:1.2rem; line-height:1; }
  .bean-photo{ width:100%; height:120px; object-fit:cover; display:block; border-radius:12px; margin-bottom:.9rem; }
  .process-photo{ width:100%; height:150px; object-fit:cover; display:block; }
  .roast-photo{ width:100%; max-width:56rem; margin:0 auto; height:70px; object-fit:cover; border-radius:12px; box-shadow:var(--shadow); display:block; }
  .roast-flow{ display:flex; flex-direction:column; gap:.25rem; }
  .roast-flow-step{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:.6rem .9rem;
    box-shadow:var(--shadow); display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap;
  }
  .roast-flow-step.highlight{ border-color:var(--accent); }
  .roast-flow-step b{ font-family:'IBM Plex Mono'; font-size:.68rem; color:var(--copper); flex-shrink:0; }
  .roast-flow-step span{ font-weight:600; font-size:.86rem; flex-shrink:0; }
  .roast-flow-step small{ font-size:.7rem; color:var(--ink-faint); margin-left:auto; text-align:right; }
  .roast-flow-arrow{ display:flex; flex-direction:column; align-items:center; gap:3px; height:26px; justify-content:center; }
  .roast-flow-arrow i{
    width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent;
    border-top:11px solid var(--accent); opacity:.2; animation:roastFlowPulse 1.4s ease-in-out infinite;
  }
  .roast-flow-arrow i:nth-child(2){ animation-delay:.15s; }
  .roast-flow-arrow i:nth-child(3){ animation-delay:.3s; }
  @keyframes roastFlowPulse{ 0%,100%{ opacity:.15; } 50%{ opacity:1; } }
  .tools-hero{ width:100%; max-width:44rem; margin:0 auto 1.4rem; height:200px; object-fit:cover; border-radius:var(--radius); box-shadow:var(--shadow); display:block; }
  .compare-wrap{ display:flex; gap:2.6rem; margin-top:1.5rem; justify-content:center; flex-wrap:wrap; }
  .compare-block{ flex:1; min-width:230px; max-width:340px; }
  .compare-block h4{ font-family:'IBM Plex Mono'; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:.7rem; text-align:center; }
  .compare-line{ display:flex; align-items:center; gap:.7rem; margin-bottom:.6rem; }
  .compare-line .name{ width:60px; font-size:.82rem; color:var(--ink-soft); flex-shrink:0; }
  .compare-track{ flex:1; height:10px; background:var(--panel-2); border-radius:6px; overflow:hidden; }
  .compare-fill{ height:100%; width:0%; border-radius:6px; transition:width 1.3s cubic-bezier(.4,0,.2,1); }
  .is-active .compare-fill{ width:var(--w); }
  .compare-fill.arabica{ background:var(--accent); }
  .compare-fill.robusta{ background:var(--copper); }
  .compare-val{ width:64px; font-family:'IBM Plex Mono'; font-size:.76rem; color:var(--ink-faint); flex-shrink:0; text-align:right; }
  .species-row{ display:flex; gap:1.6rem; justify-content:center; }
  .species-photo{ width:100%; max-width:20rem; height:auto; display:block; border-radius:var(--radius); box-shadow:var(--shadow); }
  .variety-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1.1rem; }
  .ar-ro-layout{ display:grid; grid-template-columns:1fr 3fr 1fr; gap:1.4rem; align-items:center; }
  .ar-ro-side{ display:flex; flex-direction:column; gap:.9rem; }
  .ar-ro-fact{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:.7rem .8rem; font-size:.82rem; color:var(--ink-soft); box-shadow:var(--shadow); }
  .ar-ro-fact .eyebrow{ font-family:'IBM Plex Mono'; font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; color:var(--copper); display:block; margin-bottom:.25rem; }
  .variety-grid img{ width:100%; border-radius:14px; box-shadow:var(--shadow); display:block; }
  .bean-row{ display:flex; gap:2.2rem; }
  .bean-card{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:1.4rem 1.5rem; box-shadow:var(--shadow); }
  .bean-shape{ width:64px; height:88px; margin-bottom:.9rem; position:relative; }
  .bean-shape .body{
    position:absolute; inset:0; border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;
    background:linear-gradient(160deg, var(--copper-soft), var(--copper));
  }
  .bean-shape .crease{ position:absolute; left:50%; top:14%; bottom:14%; width:2px; background:var(--paper); transform:translateX(-50%) rotate(6deg); border-radius:2px; }
  .bean-card h3{ display:flex; align-items:center; gap:.6rem; }
  .bean-card .dot{ width:8px; height:8px; border-radius:50%; background:var(--copper); }

  /* processing steps */
  .process-row{ display:flex; gap:1.4rem; }
  .process-card{
    flex:1; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:0 0 1.3rem; box-shadow:var(--shadow); overflow:hidden; position:relative; cursor:pointer;
    opacity:0; transform:translateY(14px) translate(var(--edx,0px), var(--edy,0px)) scale(var(--esc,1));
    transition:opacity .45s ease, transform .45s ease;
  }
  .is-active .process-row .process-card:nth-child(1){ transition-delay:.08s; }
  .is-active .process-row .process-card:nth-child(2){ transition-delay:.24s; }
  .is-active .process-row .process-card:nth-child(3){ transition-delay:.4s; }
  .is-active .process-row .process-card{ opacity:1; transform:translate(var(--edx,0px), var(--edy,0px)) scale(var(--esc,1)); }
  .process-card .play-badge{
    position:absolute; top:75px; left:50%; transform:translate(-50%,-50%);
    width:38px; height:38px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:.9rem; pointer-events:none;
    transition:transform .2s ease, background .2s ease;
  }
  .process-card:hover .play-badge{ transform:translate(-50%,-50%) scale(1.12); background:rgba(0,0,0,.7); }
  .video-modal{ position:fixed; inset:0; background:rgba(20,16,12,.85); z-index:200; display:none; align-items:center; justify-content:center; }
  .video-modal.is-open{ display:flex; }
  .video-modal-inner{ position:relative; max-width:92vw; max-height:88vh; }
  .video-modal-inner video{ max-width:92vw; max-height:80vh; border-radius:14px; display:block; background:#000; box-shadow:0 24px 70px rgba(0,0,0,.45); }
  .video-modal-full{
    display:block; text-align:center; margin-top:.9rem; font-family:'IBM Plex Mono'; font-size:.82rem;
    color:var(--paper); text-decoration:underline; text-underline-offset:3px;
  }
  .video-modal-full:hover{ color:var(--accent-soft, var(--accent)); }
  .video-modal-caption{
    display:block; text-align:center; margin-top:.7rem; font-family:'IBM Plex Mono'; font-size:.78rem;
    letter-spacing:.06em; text-transform:uppercase; color:var(--paper); opacity:.8;
  }
  #videoModalClose{
    position:absolute; top:-44px; right:0; width:36px; height:36px; border-radius:50%; border:none;
    background:var(--panel); color:var(--ink); font-size:1.3rem; line-height:1; cursor:pointer;
  }
  #videoModalClose:hover{ background:var(--accent); color:var(--accent-ink); }
  .process-icon{ width:64px; height:64px; margin:0 auto .9rem; position:relative; }
  .icon-sun{ width:40px; height:40px; border-radius:50%; background:var(--copper); margin:12px auto; position:relative; animation:spin 8s linear infinite; }
  .icon-sun::before,.icon-sun::after{ content:''; position:absolute; inset:-14px; border-radius:50%; border:2px dashed var(--copper-soft); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .icon-drop{ width:22px; height:28px; border-radius:50% 50% 50% 0; background:var(--accent); margin:8px auto; transform:rotate(45deg); animation:drop 1.6s ease-in-out infinite; }
  @keyframes drop{ 0%,100%{ transform:rotate(45deg) translateY(0); opacity:1;} 50%{ transform:rotate(45deg) translateY(10px); opacity:.55; } }
  .icon-honey{ width:44px; height:36px; border-radius:0 0 50% 50%/0 0 60% 60%; background:linear-gradient(180deg, var(--copper-soft), var(--copper)); margin:14px auto; position:relative; overflow:hidden; }
  .icon-honey::after{ content:''; position:absolute; inset:0; background:linear-gradient(120deg, transparent 40%, rgba(255,255,255,.4) 50%, transparent 60%); animation:sheen 2.4s ease-in-out infinite; }
  @keyframes sheen{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(100%); } }

  /* five elements */
  .orbit{ position:relative; width:460px; height:460px; margin:0 auto; max-width:100%; }
  .orbit-lines{ position:absolute; inset:0; width:100%; height:100%; z-index:1; }
  .orbit-lines .draw{ stroke-dasharray:210; stroke-dashoffset:210; transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1); }
  .is-active .orbit-lines .draw{ stroke-dashoffset:0; }
  .orbit-lines line:nth-child(1){ transition-delay:.1s; }
  .orbit-lines line:nth-child(2){ transition-delay:.3s; }
  .orbit-lines line:nth-child(3){ transition-delay:.5s; }
  .orbit-lines line:nth-child(4){ transition-delay:.7s; }
  .orbit-lines line:nth-child(5){ transition-delay:.9s; }
  .orbit .core{
    position:absolute; left:50%; top:50%; width:140px; height:140px; margin:-70px 0 0 -70px;
    border-radius:50%; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; text-align:center; font-family:'Fraunces'; font-weight:600; font-size:1.15rem;
    box-shadow:var(--shadow); z-index:2; padding:.5rem;
    opacity:0; transform:scale(.5); transition:opacity .4s ease, transform .4s cubic-bezier(.34,1.56,.64,1);
  }
  .is-active .orbit .core{ opacity:1; transform:scale(1); }
  .orbit .node{
    position:absolute; width:142px; padding:.85rem 1rem; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; font-size:1rem; font-weight:600; text-align:center; box-shadow:var(--shadow); z-index:2;
    animation:pulse 3.6s ease-in-out infinite; opacity:0; transition:opacity .5s ease;
  }
  .is-active .orbit .node{ opacity:1; }
  .orbit .node b{ display:block; color:var(--copper); font-family:'IBM Plex Mono'; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:.2rem; }
  @keyframes pulse{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  .orbit .n1{ top:-4%; left:50%; transform:translateX(-50%); }
  .orbit .n2{ top:22%; right:-6%; }
  .orbit .n3{ bottom:22%; right:-6%; }
  .orbit .n4{ bottom:-4%; left:50%; transform:translateX(-50%); }
  .orbit .n5{ top:22%; left:-6%; }
  .is-active .orbit .n1{ transition-delay:.2s; }
  .is-active .orbit .n2{ transition-delay:.4s; }
  .is-active .orbit .n3{ transition-delay:.6s; }
  .is-active .orbit .n4{ transition-delay:.8s; }
  .is-active .orbit .n5{ transition-delay:1s; }
  .orbit .n2{ animation-delay:.3s; } .orbit .n3{ animation-delay:.6s; } .orbit .n4{ animation-delay:.9s; } .orbit .n5{ animation-delay:1.2s; }

  /* extraction cups */
  .cup-row{ display:flex; gap:1.6rem; }
  .cup-card{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:1.3rem; box-shadow:var(--shadow); }
  .cup{ width:120px; height:92px; border-radius:0 0 48px 48px; margin:0 auto 1.1rem; position:relative; border:3px solid var(--line); border-top:none; }
  .cup .crema{ position:absolute; left:3px; right:3px; top:-13px; height:26px; border-radius:50%; }
  .crema-pale{ background:#e7c98f; }
  .crema-ideal{ background:#b9793c; }
  .crema-dark{ background:#4a2f1c; }
  .drip{ display:flex; justify-content:center; gap:10px; height:32px; }
  .drip i{ width:7px; height:16px; border-radius:3px; background:var(--accent); animation:fall 1.1s ease-in infinite; }
  .drip i:nth-child(2){ animation-delay:.15s; } .drip i:nth-child(3){ animation-delay:.3s; }
  @keyframes fall{ 0%{ transform:translateY(-10px); opacity:0;} 40%{ opacity:1;} 100%{ transform:translateY(16px); opacity:0;} }
  .fast .drip i{ animation-duration:.55s; }
  .slow .drip i{ animation-duration:2s; }

  /* machine / grinder */
  .machine-wrap{ display:flex; gap:3rem; align-items:flex-end; }
  .machine{ width:220px; height:140px; background:var(--panel-2); border:1px solid var(--line); border-radius:12px 12px 6px 6px; position:relative; box-shadow:var(--shadow); }
  .machine .grouphead{ position:absolute; bottom:-18px; left:30px; width:46px; height:26px; background:var(--copper); border-radius:4px; }
  .machine .portafilter{ position:absolute; bottom:-38px; left:36px; width:34px; height:16px; background:var(--ink-faint); border-radius:0 0 10px 10px; transition:transform .8s ease; }
  .is-active .machine .portafilter{ transform:translateY(2px); }
  .machine .gauge-mini{ position:absolute; top:16px; left:18px; width:34px; height:34px; border-radius:50%; border:3px solid var(--accent); }
  .machine .gauge-mini::after{ content:''; position:absolute; left:50%; top:50%; width:12px; height:2px; background:var(--copper); transform-origin:left center; animation:needle-mini 4s ease-in-out infinite; }
  @keyframes needle-mini{ 0%,100%{ transform:rotate(-30deg);} 50%{ transform:rotate(40deg);} }
  .machine .wand{ position:absolute; right:14px; top:20px; width:6px; height:60px; background:var(--ink-faint); border-radius:3px; }
  .machine .keypad{ position:absolute; top:18px; right:56px; display:grid; grid-template-columns:repeat(3,7px); gap:4px; }
  .machine .keypad i{ width:7px; height:7px; border-radius:50%; background:var(--copper-soft); }

  .grinder{ width:120px; position:relative; }
  .grinder .hopper{ width:80px; height:70px; margin:0 auto; background:linear-gradient(180deg, var(--accent-soft), var(--panel-2)); clip-path:polygon(10% 0,90% 0,65% 100%,35% 100%); position:relative; overflow:hidden; border:1px solid var(--line); }
  .grinder .bean{ position:absolute; width:6px; height:8px; border-radius:50%; background:var(--copper); left:50%; animation:sink 2.2s linear infinite; }
  .grinder .bean:nth-child(1){ left:30%; animation-delay:0s; }
  .grinder .bean:nth-child(2){ left:50%; animation-delay:.7s; }
  .grinder .bean:nth-child(3){ left:66%; animation-delay:1.4s; }
  @keyframes sink{ 0%{ top:-10px; opacity:0;} 15%{ opacity:1;} 100%{ top:65px; opacity:0;} }
  .grinder .body{ width:70px; height:54px; margin:0 auto; background:var(--panel-2); border:1px solid var(--line); border-radius:0 0 14px 14px; position:relative; }
  .grinder .body::after{ content:''; position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; border:3px solid var(--copper); border-top-color:transparent; animation:spin 1.4s linear infinite; }
  .grinder .chute{ width:16px; height:20px; margin:0 auto; background:var(--ink-faint); border-radius:0 0 6px 6px; }
  .grinder .label{ text-align:center; font-family:'IBM Plex Mono'; font-size:.7rem; color:var(--ink-soft); margin-top:.6rem; }

  .type-row{ display:flex; gap:1.2rem; margin-top:1.6rem; }
  .type-card{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:1rem; text-align:center; }
  .type-card b{ display:block; font-size:.85rem; margin-bottom:.2rem; }
  .type-card span{ font-size:.82rem; color:var(--ink-faint); }

  /* grind dial + texture */
  .dial-wrap{ display:flex; align-items:center; gap:3rem; }
  .knob{ width:150px; height:150px; border-radius:50%; background:var(--panel-2); border:1px solid var(--line); position:relative; box-shadow:var(--shadow); }
  .knob .pointer{ position:absolute; left:50%; top:8px; width:4px; height:40px; background:var(--copper); border-radius:2px; transform-origin:50% 67px; transform:translateX(-50%) rotate(-50deg); transition:transform 1.4s cubic-bezier(.34,1.3,.4,1); }
  .is-active .knob .pointer{ transform:translateX(-50%) rotate(50deg); }
  .knob .tick{ position:absolute; left:50%; top:50%; font-family:'IBM Plex Mono'; font-size:.64rem; color:var(--ink-faint); transform-origin:0 0; }
  .texture-row{ display:flex; gap:.5rem; align-items:flex-end; height:120px; }
  .texture-col{ flex:1; display:flex; flex-wrap:wrap; align-content:flex-end; gap:2px; justify-content:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:.5rem; height:100%; }
  .texture-col i{ background:var(--copper); border-radius:1px; }
  .texture-label{ text-align:center; font-family:'IBM Plex Mono'; font-size:.76rem; color:var(--ink-faint); margin-top:.4rem; }

  /* tamping */
  .tamp-row{ display:flex; gap:1.4rem; }
  .tamp-card{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:1.6rem 1.2rem; text-align:center; box-shadow:var(--shadow); }
  .basket{ width:140px; height:62px; margin:0 auto .7rem; background:var(--panel-2); border:1px solid var(--line); border-radius:0 0 28px 28px; position:relative; overflow:hidden; }
  .basket .bed{ position:absolute; left:0; right:0; bottom:0; height:70%; background:var(--copper); transition:clip-path 1s ease; }
  .bed-channel{ clip-path:polygon(0 30%,45% 30%,45% 100%,55% 100%,55% 30%,100% 30%,100% 100%,0 100%); }
  .bed-uneven{ clip-path:polygon(0 55%,100% 10%,100% 100%,0 100%); }
  .bed-even{ clip-path:polygon(0 20%,100% 20%,100% 100%,0 100%); }

  /* milk */
  .milk-wrap{ display:flex; gap:3.2rem; align-items:center; }
  .pitcher{ width:110px; height:120px; position:relative; }
  .pitcher .jug{ position:absolute; bottom:0; width:110px; height:96px; border-radius:0 0 42px 42px / 0 0 60px 60px; background:linear-gradient(180deg, var(--panel-2), var(--panel)); border:2px solid var(--line); overflow:hidden; }
  .pitcher .milk{ position:absolute; bottom:0; left:0; right:0; height:70%; background:linear-gradient(180deg,#fbf6ea,#e9dcc0); }
  .pitcher .swirl{ position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg, rgba(255,255,255,.55), transparent 30%, rgba(255,255,255,.35) 60%, transparent 90%); animation:spin 2.4s linear infinite; mix-blend-mode:soft-light; }
  .pitcher .spout{ position:absolute; top:14px; right:-6px; width:20px; height:10px; background:var(--panel-2); border:2px solid var(--line); border-radius:0 8px 8px 0; }

  /* trainers */
  .trainer-row{ display:flex; gap:1.6rem; }
  .trainer-card{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:1.5rem; box-shadow:var(--shadow); }
  .trainer-avatar{ width:56px; height:56px; border-radius:50%; background:linear-gradient(160deg, var(--accent-soft), var(--accent)); margin-bottom:.9rem; display:flex; align-items:center; justify-content:center; font-family:'Fraunces'; font-weight:600; color:var(--accent-ink); font-size:1.3rem; object-fit:cover; }
  .trainer-card-photo, .trainer-card-split{ position:relative; overflow:hidden; padding:0; display:flex; flex-direction:column; }
  .trainer-card-photo{ min-height:460px; }
  .trainer-photo-section{ position:relative; flex:1 1 230px; min-height:230px; }
  .trainer-photo-fill{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .trainer-scrim{
    position:absolute; left:0; right:0; bottom:0; z-index:2; padding:1.3rem 1.4rem 1.1rem;
    background:linear-gradient(0deg, rgba(18,15,11,.88), rgba(18,15,11,.45) 65%, transparent);
  }
  .trainer-scrim h3{ color:#fff; }
  .trainer-scrim p{ color:#e9e3d5; font-size:.92rem; margin:.3rem 0 0; }
  .trainer-scrim .badge{ background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.35); }
  .trainer-body{ padding:1.1rem 1.3rem 1.3rem; background:var(--panel); }
  .trainer-card-composite{ position:relative; overflow:hidden; padding:0; min-height:460px; }
  .composite-cert{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .composite-photo{ position:absolute; left:0; right:0; bottom:0; width:100%; height:54%; object-fit:cover; object-position:top center; box-shadow:0 -8px 24px -10px rgba(0,0,0,.35); z-index:1; }
  .composite-scrim{ z-index:2; }
  .badge{ display:inline-flex; align-items:center; gap:.35rem; font-family:'IBM Plex Mono'; font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; background:var(--copper-soft); color:var(--copper); padding:.25rem .6rem; border-radius:999px; margin-top:.6rem; }

  /* pathway */
  .path-row{ display:flex; align-items:center; gap:.8rem; }
  .path-step{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:1.1rem 1.2rem; text-align:center; position:relative; }
  .path-step.current{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow); transform:scale(1.05); }
  .path-step.current .path-dur{ color:var(--accent-ink); opacity:.85; }
  .path-arrow{ color:var(--ink-faint); font-size:1.2rem; }
  .growth-row{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.55rem; }
  .growth-step{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:.6rem 1rem;
    text-align:center; min-width:96px; box-shadow:var(--shadow);
  }
  .growth-step b{ display:block; font-family:'IBM Plex Mono'; font-size:.66rem; color:var(--copper); margin-bottom:.15rem; }
  .growth-step span{ font-size:.8rem; font-weight:600; }
  .path-dur{ font-family:'IBM Plex Mono'; font-size:.72rem; color:var(--ink-faint); margin-top:.3rem; }

  /* connect-discover-respond loop */
  .loop{ display:flex; justify-content:center; gap:1.6rem; }
  .loop-step{ width:150px; text-align:center; }
  .loop-circle{ width:84px; height:84px; border-radius:50%; margin:0 auto .8rem; background:var(--panel); border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; font-family:'Fraunces'; font-size:1.6rem; color:var(--accent); animation:ring 2.8s ease-in-out infinite; }
  @keyframes ring{ 0%,100%{ box-shadow:0 0 0 0 var(--accent-soft);} 50%{ box-shadow:0 0 0 10px transparent;} }
  .loop-step:nth-child(2) .loop-circle{ animation-delay:.4s; }
  .loop-step:nth-child(3) .loop-circle{ animation-delay:.8s; }

  /* stepper (barista routine) */
  .stepper{ display:grid; grid-template-columns:repeat(6,1fr); gap:.7rem; }
  .step{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:.75rem .7rem; font-size:.76rem; line-height:1.35; position:relative; }
  .step .n{ font-family:'IBM Plex Mono'; color:var(--copper); font-weight:600; display:block; margin-bottom:.25rem; }

  /* drink glasses */
  .drink-row{ display:flex; gap:1.6rem; justify-content:center; }
  .drink{ text-align:center; }
  .glass{ width:64px; height:104px; border:2px solid rgba(255,255,255,.55); border-top:none; border-radius:0 0 16px 16px; position:relative; overflow:hidden; background:linear-gradient(135deg, rgba(255,255,255,.4), rgba(255,255,255,.08)); box-shadow:inset 0 0 0 1px var(--line); margin:0 auto .7rem; }
  .glass .layer{ position:absolute; left:0; right:0; bottom:0; transition:height 1.1s cubic-bezier(.4,0,.2,1); }
  .glass .layer:nth-child(1){ z-index:4; }
  .glass .layer:nth-child(2){ z-index:3; }
  .glass .layer:nth-child(3){ z-index:2; }
  .glass .layer:nth-child(4){ z-index:1; }
  .l-espresso{ background:#4a2f1c; }
  .l-water{ background:#cfe0da; }
  .l-milk{ background:#f2e6cd; }
  .l-foam{ background:#fbf6ea; }
  .l-chocolate{ background:#6b3a1f; }
  .l-cream{ background:#f7f0e0; }
  .l-whiskey{ background:#c9822e; }
  .l-icecream{ background:#f3d9d5; }
  .drink .name{ font-weight:600; font-size:.85rem; }
  .drink .ratio{ font-family:'IBM Plex Mono'; font-size:.66rem; color:var(--ink-faint); }

  /* grooming icons */
  .groom-row{ display:flex; gap:1.2rem; }
  .groom-card{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:1.2rem; text-align:center; box-shadow:var(--shadow);
    opacity:0; transform:translateY(14px) translate(var(--edx,0px), var(--edy,0px)) scale(var(--esc,1));
    transition:opacity .45s ease, transform .45s ease;
  }
  .is-active .groom-row .groom-card:nth-child(1){ transition-delay:.08s; }
  .is-active .groom-row .groom-card:nth-child(2){ transition-delay:.2s; }
  .is-active .groom-row .groom-card:nth-child(3){ transition-delay:.32s; }
  .is-active .groom-row .groom-card:nth-child(4){ transition-delay:.44s; }
  .is-active .groom-row .groom-card{ opacity:1; transform:translate(var(--edx,0px), var(--edy,0px)) scale(var(--esc,1)); }
  .groom-icon{ width:46px; height:46px; margin:0 auto .7rem; border-radius:12px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:1.3rem; color:var(--accent); }

  .defect-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1.1rem; }
  .defect-tile{
    position:relative; aspect-ratio:1/1; border-radius:16px; overflow:hidden; box-shadow:var(--shadow);
    opacity:0; transform:translateY(14px) translate(var(--edx,0px), var(--edy,0px)) scale(var(--esc,1));
    transition:opacity .45s ease, transform .45s ease;
  }
  .defect-tile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .defect-scrim{
    position:absolute; left:0; right:0; bottom:0; padding:.9rem .8rem .7rem;
    background:linear-gradient(to top, rgba(20,14,8,.82), rgba(20,14,8,0)); color:#fff;
  }
  .defect-scrim h3{ font-size:.88rem; margin-bottom:.15rem; }
  .defect-scrim p{ font-size:.7rem; opacity:.88; line-height:1.35; }
  .is-active .defect-grid .defect-tile:nth-child(1){ transition-delay:.08s; }
  .is-active .defect-grid .defect-tile:nth-child(2){ transition-delay:.2s; }
  .is-active .defect-grid .defect-tile:nth-child(3){ transition-delay:.32s; }
  .is-active .defect-grid .defect-tile:nth-child(4){ transition-delay:.44s; }
  .is-active .defect-grid .defect-tile{ opacity:1; transform:translate(var(--edx,0px), var(--edy,0px)) scale(var(--esc,1)); }

  /* roast bar */
  .roast-bar{ height:34px; border-radius:17px; background:linear-gradient(90deg,#8a9a6a,#d8c08a,#c99a5e,#a06b3a,#5c3a22,#241712); position:relative; box-shadow:var(--shadow); }
  .roast-bar .marker{ position:absolute; top:-8px; width:2px; height:50px; background:var(--ink); opacity:.5; }
  .roast-ticks{ display:flex; justify-content:space-between; margin-top:.6rem; font-family:'IBM Plex Mono'; font-size:.78rem; color:var(--ink-faint); }

  /* workspace zones */
  .bar-top{ position:relative; width:100%; max-width:640px; margin:0 auto; height:220px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .zone{ position:absolute; border:1px dashed var(--line); border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-size:.68rem; color:var(--ink-soft); text-align:center; padding:.3rem; animation:glow 6s ease-in-out infinite; }
  @keyframes glow{ 0%,100%{ border-color:var(--line); background:transparent;} 16%{ border-color:var(--accent); background:var(--accent-soft);} 33%{ border-color:var(--line); background:transparent;} }
  .z1{ left:4%; top:12%; width:22%; height:32%; animation-delay:0s; }
  .z2{ left:30%; top:8%; width:20%; height:40%; animation-delay:1.5s; }
  .z3{ left:54%; top:12%; width:22%; height:32%; animation-delay:3s; }
  .z4{ left:80%; top:16%; width:16%; height:26%; animation-delay:4.5s; }
  .z5{ left:12%; bottom:8%; width:76%; height:20%; animation-delay:2.2s; }

  /* cover */
  .cover{ align-items:center; text-align:left; position:relative; overflow:hidden; }
  .cover-logo-big{ width:470px; height:auto; flex-shrink:0; position:relative; z-index:1; }
  .cover-bg-photo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;
    opacity:.16; filter:sepia(.25) saturate(1.1);
    animation:cover-bg-pan 22s ease-in-out infinite alternate;
  }
  @keyframes cover-bg-pan{ 0%{ transform:scale(1.05) translate(0,0);} 100%{ transform:scale(1.16) translate(-1.5%,-1.5%);} }
  .cover .content{ max-width:62rem; margin:0 auto; position:relative; z-index:1; display:flex; align-items:center; gap:3.2rem; }
  .cover-icon{ width:64px; height:auto; margin:0 auto 1.1rem; display:block; opacity:.85; }
  .cover-welcome{ font-family:'Fraunces'; font-style:italic; font-weight:300; font-size:1.5rem; color:var(--ink-soft); margin-bottom:.3rem; }
  .cover-mark{ font-family:'IBM Plex Mono'; font-size:.9rem; letter-spacing:.16em; text-transform:uppercase; color:var(--copper); margin-bottom:1.4rem; }
  .cover h1{ font-size:clamp(2.6rem,6vw,4.4rem); font-weight:600; line-height:1.03; }
  .cover h1 em{ font-style:italic; font-weight:300; color:var(--accent); }
  .cover .steam{ position:relative; width:2px; height:60px; margin:1.6rem 0 0 10px; }
  .cover .steam i{ position:absolute; bottom:0; left:0; width:2px; height:22px; background:linear-gradient(180deg, transparent, var(--ink-faint)); border-radius:2px; animation:steam 3s ease-in-out infinite; opacity:.6; }

<script>
(function(){

  var S = []; // {module:0-8 or 'start'/'end', title, html}

  // ---- Front matter ----
  slide('start', `
    <div class="slide cover">
      <img class="cover-bg-photo" src="assets/img/img-001.jpg" alt="">
      <div class="content">
        <img class="cover-logo-big" src="assets/img/img-002.png" alt="BUONO Coffee Academy">
        <div class="cover-text">
          <div class="cover-welcome">Welcome to</div>
          <div class="cover-mark">BUONO Coffee Academy &middot; SCA Barista Skills Program</div>
          <h1>Foundation<br><em>in coffee.</em></h1>
          <div class="steam"><i></i><i></i><i></i></div>
          <div class="cover-foot">Kandy, Sri Lanka &nbsp;&middot;&nbsp; Est. 8 years in specialty coffee</div>
        </div>
      </div>
    </div>`);

  slide('start', `
    <div class="slide">
      <div class="kicker"><span>Who We Are</span></div>
      <div class="content">
        <h2 class="title">Kandy's first dedicated barista academy.</h2>
        <p class="lede">We've spent nearly eight years behind the bar before we ever stood in front of a classroom &mdash; and we built BUONO Coffee Academy to pass that working knowledge on, one skilled barista at a time.</p>
        <div class="grid3">
          <div class="card"><span class="stat">1<sup style="font-size:1rem">st</sup><small>Barista academy in Kandy</small></span></div>
          <div class="card"><span class="stat">8<small>Years in the coffee industry</small></span></div>
          <div class="card"><span class="stat">8<small>Students per class, by design</small></span></div>
        </div>
        <div class="card" style="margin-top:1.4rem;">
          <span class="eyebrow">Specialty coffee, defined</span>
          <p style="font-size:.9rem; color:var(--ink-soft); line-height:1.5;">The SCA calls a coffee <b>specialty</b> when it scores <b>80 or above</b> on their 100-point grading scale, can be traced back to where it was grown, and has been assessed for quality at every stage from farm to cup.</p>
        </div>

  slide('start', `
    <div class="slide">
      <div class="kicker"><span>The SCA Pathway</span></div>
      <div class="content wide">
        <h2 class="title">Three levels. You're starting at the first.</h2>

          <span class="path-arrow">&#8594;</span>
          <div class="path-step">Professional<div class="path-dur">SCA: 21 guided-learning hours</div></div>
        </div>
        <p style="margin-top:1.6rem; font-size:.86rem; color:var(--ink-faint);">Assessed by written &amp; practical exam &middot; certified by the SCA and by BUONO Coffee Academy (TVEC approved).</p>
        <p style="margin-top:.5rem; font-size:.86rem; color:var(--ink-faint);">Foundation is quoted as course length; Intermediate and Professional are SCA guided-learning hours &mdash; two different measures, not points on the same scale.</p>
      </div>
    </div>`);

  slide('start', `
    <div class="slide">
      <div class="kicker"><span>Today's Map</span></div>

          <div class="agenda-item" style="font-size:20px; width:407px; height:79px;"><b style="font-size:inherit;">01</b><span style="font-size:inherit;">Introduction to Coffee</span></div>
          <div class="agenda-item" style="font-size:20px; width:406px; height:79px;"><b style="font-size:inherit;">02</b><span style="font-size:inherit;">Espresso Fundamentals</span></div>
          <div class="agenda-item" style="font-size:20px; width:407px; height:79px;"><b style="font-size:inherit;">03</b><span style="font-size:inherit;">Espresso Equipment</span></div>
          <div class="agenda-item" style="font-size:20px; width:407px; height:79px;"><b style="font-size:inherit;">04</b><span style="font-size:inherit;">Grinder Adjustment</span></div>
          <div class="agenda-item" style="font-size:18px; width:407px; height:79px;"><b style="font-size:inherit;">05</b><span style="font-size:inherit;">Milk Techniques</span></div>
          <div class="agenda-item" style="font-size:20px; width:406px; height:79px;"><b style="font-size:inherit;">06</b><span style="font-size:inherit;">Basic Drinks Preparation</span></div>

  // ---- Module 1: Introduction to Coffee ----
  slide(1, `
    <div class="slide">
      <div class="kicker"><span class="num">01</span><span class="sep">/</span><span>Introduction to Coffee</span><span class="of">&middot; 1 of 12</span></div>
      <div class="content wide">
        <h2 class="title">From cherry to cup.</h2>
        <div class="grid2">
          <figure style="margin:0;"><img class="photo-frame" style="aspect-ratio:3/2;" src="assets/img/img-003.jpg" alt="Kaldi and his dancing goats — a 1922 illustration of the coffee discovery legend"><figcaption style="font-size:.72rem; color:var(--ink-faint); text-align:center; margin-top:.5rem; font-style:italic;">&ldquo;Kaldi and His Dancing Goats,&rdquo; 1922 &mdash; public domain</figcaption></figure>
          <div style="font-size:22px; width:820px; height:569px; transform:translate(-3px,-27px);">
            <p class="lede" style="margin-bottom:1rem;">Legend says an Ethiopian goat-herder named <b>Kaldi</b> discovered coffee in <b>c. 850 AD</b>, after noticing his goats grow lively on the berries of a wild tree.</p>
            <p class="lede" style="margin-bottom:1rem;">Coffee reached Sri Lanka through the Dutch, who planted it here after taking Ceylon from the Portuguese in <b>1656</b>.</p>
            <p style="font-size:inherit; color:var(--ink-soft); line-height:1.5; margin-bottom:1rem;">By around 1870 Ceylon was one of the world&rsquo;s largest coffee exporters &mdash; roughly 118 million lb a year. Coffee leaf rust (<i>Hemileia vastatrix</i>) appeared at Madulsima in <b>1869</b>; by 1890 about 90% of the coffee land had been abandoned and replanted with tea &mdash; which is how Sri Lanka became a tea country.</p>
            <ul class="list tight">
              <li style="font-size:inherit;">Coffee is a <b>seed</b> from the coffee cherry &mdash; the fruit of the coffee plant.</li>
              <li style="font-size:inherit;">Over <b>125 species</b> exist; only two are grown commercially.</li>
              <li style="font-size:inherit;">An evergreen plant, living up to <b>50 years</b>.</li>
              <li style="font-size:inherit;">Takes <b>3&ndash;5 years</b> to bear its first fruit.</li>
            </ul>
          </div>
        </div>
      </div>
    </div>`);

  slide(1, `
    <div class="slide">
      <div class="kicker"><span class="num">01</span><span class="sep">/</span><span>Introduction to Coffee</span><span class="of">&middot; 2 of 12</span></div>
      <div class="content wide" style="position:relative; min-height:32rem;">
        <h2 class="title" style="margin-bottom:1.1rem;">From flower to ripe cherry.</h2>
        <img class="stage-photo" src="assets/img/img-004.jpg" alt="The growth stages of a coffee plant, arranged in a circle" style="left:calc(50% - 85px); top:8rem; --edx:-43px; --edy:123px; --esc:2.50;">

        <div class="stage-card" style="left:calc(50% + 200px); top:3rem; --edx:-24px; --edy:193px; font-size:24px; width:144px; height:105px;"><b style="font-size:inherit;">2</b><span style="font-size:inherit;">Green Cherry</span></div>

        <div class="stage-card" style="left:2rem; top:26rem; --edx:403px; --edy:50px; font-size:24px; width:156px; height:69px;"><b style="font-size:inherit;">5</b><span style="font-size:inherit;">Parchment</span></div>
        <div class="stage-card" style="right:2rem; top:0rem; --edx:-1091px; --edy:247px; font-size:24px; width:156px; height:105px;"><b style="font-size:inherit;">6</b><span style="font-size:inherit;">Roasted Bean</span></div>
      </div>
    </div>`);

  slide(1, `
    <div class="slide">
      <div class="kicker"><span class="num">01</span><span class="sep">/</span><span>Introduction to Coffee</span><span class="of">&middot; 3 of 12</span></div>

        <h2 class="title" style="margin-bottom:1.3rem;">Inside the coffee cherry.</h2>

          <video class="photo-frame" style="aspect-ratio:4/5; max-height:440px; width:auto; margin:0 auto;" autoplay muted loop playsinline aria-label="Exploded view of a coffee cherry showing its skin, pulp, mucilage, parchment, silverskin and bean layers"><source src="assets/video/video-001.mp4" type="video/mp4"></video>
          <ul class="list cherry-anim">
            <li><b>Skin (Exocarp)</b> &mdash; the outer red or yellow peel.</li>
            <li><b>Pulp (Mesocarp)</b> &mdash; sweet fruit flesh beneath it.</li>
            <li><b>Mucilage</b> &mdash; a sticky, sugary layer.</li>

    <div class="slide">
      <div class="kicker"><span class="num">01</span><span class="sep">/</span><span>Introduction to Coffee</span><span class="of">&middot; 4 of 12</span></div>

      });
    } else {
      el.style.removeProperty('font-size');
      Array.prototype.forEach.call(el.querySelectorAll('*'), function(c){
        c.style.removeProperty('font-size');
      });
    }
    el.style.width = (data.w != null) ? (data.w+'px') : '';
    el.style.height = (data.h != null) ? (data.h+'px') : '';
  }

  var editBtn = document.createElement('button');
  editBtn.className = 'nav-btn';
  editBtn.id = 'editToggleBtn';
  editBtn.title = 'Edit mode';
  editBtn.setAttribute('aria-label', 'Toggle edit mode');
  editBtn.innerHTML = '&#9998;';
  var controlsSide = document.querySelector('#controls .side');
  if(controlsSide) controlsSide.appendChild(editBtn);

  var NO_RECURSE = ['chart-wrap','drink-row','texture-row','machine','compare-wrap','compare-track','grinder','knob','layer','steam','espresso-numbers-photo','orbit-step','stage-card','card','agenda-item','ar-ro-side','defect-tile','process-card','cup-card','type-card','tamp-card','groom-card','roast-flow-step','loop-step','step','varietree-leaf','node','therm','gauge','path-step','sob-gallery','water-cup-photo','machine-diagram'];
  var TRANSPARENT = ['grid2','grid3','grid4','agenda-grid','ar-ro-layout','species-row','cup-row','therm-row','gauge-row','groom-row','tamp-row','type-row','process-row','defect-grid','stepper','path-row','roast-flow','loop'];
  function hashStr(s){
    var h = 5381;
    for(var i=0;i<s.length;i++){ h = ((h*33) ^ s.charCodeAt(i)) >>> 0; }
    return h.toString(36);
  }
  function fingerprint(el){
    var cls = (typeof el.className === 'string' && el.className) ? el.className.trim().split(/\s+/)[0] : el.tagName.toLowerCase();
    var text = (el.textContent || '').trim().replace(/\s+/g,' ').slice(0,60);
    var img = (el.tagName === 'IMG') ? el : el.querySelector('img');
    var imgKey = img ? (img.getAttribute('alt') || img.getAttribute('src') || '') : '';
    return cls + '|' + text + '|' + imgKey;
  }
  try {
    Array.prototype.forEach.call(document.querySelectorAll('#stage .slide'), function(slideEl, si){
      var fpCounts = {};
      function tagOnce(el){
        if(el.dataset.editkey) return;
        var fp = fingerprint(el);
        var n = (fpCounts[fp] = (fpCounts[fp]||0) + 1);
        el.dataset.editkey = 's' + si + '-k' + hashStr(fp) + (n > 1 ? ('-' + n) : '');
      }
      function skipRecurse(el){
        for(var i=0;i<NO_RECURSE.length;i++){ if(el.classList.contains(NO_RECURSE[i])) return true; }
        return false;
      }
      function isTransparent(el){
        for(var i=0;i<TRANSPARENT.length;i++){ if(el.classList.contains(TRANSPARENT[i])) return true; }
        return false;
      }
      function tagChildren(el, depth){
        if(depth <= 0) return;
        Array.prototype.forEach.call(el.children, function(child){
          if(child.tagName === 'LI') return;
          var transparent = isTransparent(child);
          if(!transparent) tagOnce(child);
          if(!skipRecurse(child)) tagChildren(child, transparent ? depth : depth-1);
        });
      }
      slideEl.querySelectorAll('.kicker').forEach(tagOnce);
      slideEl.querySelectorAll('.content').forEach(function(contentEl){
        tagChildren(contentEl, 3);
      });
    });
  } catch(e){ console.error('edit-mode tagging failed', e); }

  var panel = document.getElementById('editPanel');
  var epKey = document.getElementById('epKey');
  var editModeOn = false;
  var selectedKeys = [];

  function isSelected(key){ return selectedKeys.indexOf(key) !== -1; }

  function setSelection(keys){
    selectedKeys.forEach(function(k){
      var el = document.querySelector('[data-editkey="'+k+'"]');
      if(el) el.classList.remove('is-edit-selected');
    });
    selectedKeys = keys.slice();
    selectedKeys.forEach(function(k){
      var el = document.querySelector('[data-editkey="'+k+'"]');
      if(el) el.classList.add('is-edit-selected');
    });
    epKey.textContent = selectedKeys.length === 0 ? '' :
      (selectedKeys.length === 1 ? selectedKeys[0] : (selectedKeys.length + ' items selected'));
    panel.classList.toggle('is-open', selectedKeys.length > 0);
  }

  function deselect(){ setSelection([]); }

  function setEditMode(on){
    editModeOn = on;
    document.body.classList.toggle('edit-mode', on);
    editBtn.classList.toggle('is-current', on);
    if(!on) deselect();
  }

  editBtn.addEventListener('click', function(){ setEditMode(!editModeOn); });

  function scheduleSave(){ /* no live store on this host - values live in `overrides` until exported */ }
  function dataFor(key){
    var d = overrides[key] || {};
    return {dx:d.dx||0, dy:d.dy||0, scale:d.scale||1, fs:(d.fs!=null?d.fs:null), w:(d.w!=null?d.w:null), h:(d.h!=null?d.h:null)};
  }
  function setDataFor(key, d){
    overrides[key] = d;
    applyOverride(key, d);
  }
  function nudge(dx, dy){
    selectedKeys.forEach(function(key){
      var d = dataFor(key);
      d = {dx:d.dx+dx, dy:d.dy+dy, scale:d.scale, fs:d.fs, w:d.w, h:d.h};
      setDataFor(key, d);
      scheduleSave(key, d);
    });
  }
  function rescale(delta){
    selectedKeys.forEach(function(key){
      var d = dataFor(key);
      d = {dx:d.dx, dy:d.dy, scale:Math.max(.4, Math.min(2.5, d.scale+delta)), fs:d.fs, w:d.w, h:d.h};
      setDataFor(key, d);
      scheduleSave(key, d);
    });
  }
  function fontStep(delta){
    selectedKeys.forEach(function(key){
      var el = document.querySelector('[data-editkey="'+key+'"]');
      if(!el) return;
      var d = dataFor(key);
      var base = d.fs != null ? d.fs : parseFloat(getComputedStyle(el).fontSize);
      var w = d.w != null ? d.w : el.offsetWidth;
      var h = d.h != null ? d.h : el.offsetHeight;
      d = {dx:d.dx, dy:d.dy, scale:d.scale, fs:Math.max(8, base+delta), w:w, h:h};
      setDataFor(key, d);
      scheduleSave(key, d);
    });
  }
  function widthStep(delta){
    selectedKeys.forEach(function(key){
      var el = document.querySelector('[data-editkey="'+key+'"]');
      if(!el) return;
      var d = dataFor(key);
      var base = d.w != null ? d.w : el.getBoundingClientRect().width / (d.scale||1);
      d = {dx:d.dx, dy:d.dy, scale:d.scale, fs:d.fs, w:Math.max(20, base+delta), h:d.h};
      setDataFor(key, d);
      scheduleSave(key, d);
    });
  }
  function heightStep(delta){
    selectedKeys.forEach(function(key){
      var el = document.querySelector('[data-editkey="'+key+'"]');
      if(!el) return;
      var d = dataFor(key);
      var base = d.h != null ? d.h : el.getBoundingClientRect().height / (d.scale||1);
      d = {dx:d.dx, dy:d.dy, scale:d.scale, fs:d.fs, w:d.w, h:Math.max(20, base+delta)};
      setDataFor(key, d);
      scheduleSave(key, d);
    });
  }
  function resetSel(){
    selectedKeys.forEach(function(key){
      setDataFor(key, {dx:0, dy:0, scale:1, fs:null, w:null, h:null});
      delete overrides[key];
    });
  }

  function describeKey(key){
    var el = document.querySelector('[data-editkey="'+key+'"]');
    if(!el) return key;
    var slideEl = el.closest('.slide');
    var title = slideEl ? slideEl.querySelector('.title, h2, h3') : null;
    var label = (title && title.textContent.trim().slice(0,40)) || '';
    var own = (el.textContent || '').trim().replace(/\s+/g,' ').slice(0,30);
    return key + (label ? '  [slide: "'+label+'"]' : '') + (own ? '  [element: "'+own+'"]' : '');
  }

  function exportChanges(){
    var lines = [];
    Object.keys(overrides).forEach(function(key){
      var d = overrides[key];
      var isDefault = (!d.dx && !d.dy && (!d.scale || d.scale===1) && d.fs==null && d.w==null && d.h==null);
      if(isDefault) return;
      var parts = [];
      if(d.dx) parts.push('dx:'+Math.round(d.dx));
      if(d.dy) parts.push('dy:'+Math.round(d.dy));
      if(d.scale && d.scale!==1) parts.push('scale:'+d.scale.toFixed(2));
      if(d.fs!=null) parts.push('font-size:'+Math.round(d.fs)+'px');
      if(d.w!=null) parts.push('width:'+Math.round(d.w)+'px');
      if(d.h!=null) parts.push('height:'+Math.round(d.h)+'px');
      lines.push(describeKey(key) + '\n    ' + parts.join(', '));
    });
    var text = lines.length ? lines.join('\n\n') : '(no changes made this session)';
    var ta = document.getElementById('epExportArea');
    ta.value = text;
    ta.hidden = false;
    ta.focus();
    ta.select();
    try {
      navigator.clipboard.writeText(text).then(function(){
        var btn = panel.querySelector('[data-act="export"]');
        var was = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(function(){ btn.textContent = was; }, 1400);
      }).catch(function(){});
    } catch(e){}
  }

  function clearGuides(){
    document.querySelectorAll('.align-guide-v,.align-guide-h').forEach(function(g){ g.remove(); });
  }
  function drawGuideV(x){
    var g = document.createElement('i'); g.className = 'align-guide-v'; g.style.left = x+'px';
    document.body.appendChild(g);
  }
  function drawGuideH(y){
    var g = document.createElement('i'); g.className = 'align-guide-h'; g.style.top = y+'px';
    document.body.appendChild(g);
  }
  function checkAlign(target){
    clearGuides();
    var snap = {x:0, y:0};
    var activeSlide = target.closest('.slide.is-active');
    if(!activeSlide) return snap;
    var THRESH = 6;
    var r0 = target.getBoundingClientRect();
    var mineV = [r0.left, r0.left+r0.width/2, r0.right];
    var mineH = [r0.top, r0.top+r0.height/2, r0.bottom];
    Array.prototype.forEach.call(activeSlide.querySelectorAll('[data-editkey]'), function(o){
      if(o === target) return;
      var r = o.getBoundingClientRect();
      if(r.width === 0 && r.height === 0) return;
      var oV = [r.left, r.left+r.width/2, r.right];
      var oH = [r.top, r.top+r.height/2, r.bottom];
      mineV.forEach(function(m){
        oV.forEach(function(ov){
          if(Math.abs(m-ov) <= THRESH){ snap.x = ov - m; drawGuideV(ov); }
        });
      });
      mineH.forEach(function(m){
        oH.forEach(function(oh){
          if(Math.abs(m-oh) <= THRESH){ snap.y = oh - m; drawGuideH(oh); }
        });
      });
    });
    return snap;
  }

  function computePathKey(si, el, slideEl){
    var path = [];
    var node = el;
    while(node && node !== slideEl){
      var parent = node.parentElement;
      if(!parent) break;
      path.unshift(Array.prototype.indexOf.call(parent.children, node));
      node = parent;
    }
    return 's' + si + '-p' + path.join('.');
  }

  var dragState = null;
  document.getElementById('stage').addEventListener('mousedown', function(e){
    if(!editModeOn) return;
    var slideEl = e.target.closest('.slide.is-active');
    if(!slideEl) return;
    var target = e.target.closest('[data-editkey]');
    if(!target){
      if(e.target === slideEl){ deselect(); return; }
      target = e.target;
      if(!target.dataset.editkey){
        var si = Array.prototype.indexOf.call(document.querySelectorAll('#stage .slide'), slideEl);
        target.dataset.editkey = computePathKey(si, target, slideEl);
      }
    }
    e.preventDefault();
    var key = target.dataset.editkey;
    var pendingToggle = null;
    if(e.ctrlKey || e.metaKey){
      if(isSelected(key)){
        pendingToggle = key; // could be a group-drag start; only toggle off if it ends up a plain click
      } else {
        setSelection(selectedKeys.concat([key]));
      }
    } else if(!isSelected(key)){
      setSelection([key]);
    }
    if(selectedKeys.length === 0) return;
    var bases = {};
    selectedKeys.forEach(function(k){ bases[k] = dataFor(k); });
    dragState = { el: target, startX: e.clientX, startY: e.clientY, bases: bases, pendingToggle: pendingToggle, moved: false };
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', function(e){
    if(!dragState) return;
    var ddx = e.clientX - dragState.startX;
    var ddy = e.clientY - dragState.startY;
    if(!dragState.moved && Math.abs(ddx) <= 4 && Math.abs(ddy) <= 4) return;
    dragState.moved = true;
    Object.keys(dragState.bases).forEach(function(key){
      var b = dragState.bases[key];
      setDataFor(key, { dx: b.dx+ddx, dy: b.dy+ddy, scale: b.scale, fs: b.fs, w: b.w, h: b.h });
    });
    if(e.shiftKey){
      var snap = checkAlign(dragState.el);
      if(snap.x || snap.y){
        Object.keys(dragState.bases).forEach(function(key){
          var d = overrides[key];
          setDataFor(key, { dx: d.dx+snap.x, dy: d.dy+snap.y, scale: d.scale, fs: d.fs, w: d.w, h: d.h });
        });
      }
    } else {
      clearGuides();
    }
  });
  document.addEventListener('mouseup', function(){
    if(!dragState) return;
    var keys = Object.keys(dragState.bases);
    var pendingToggle = dragState.pendingToggle;
    var moved = dragState.moved;
    dragState = null;
    document.body.style.userSelect = '';
    clearGuides();
    keys.forEach(function(key){
      var d = overrides[key];
      if(d) scheduleSave(key, d);
    });
    if(pendingToggle && !moved){
      setSelection(selectedKeys.filter(function(k){ return k !== pendingToggle; }));
    }
  });

  panel.querySelector('[data-act="up"]').addEventListener('click', function(){ nudge(0,-6); });
  panel.querySelector('[data-act="down"]').addEventListener('click', function(){ nudge(0,6); });
  panel.querySelector('[data-act="left"]').addEventListener('click', function(){ nudge(-6,0); });
  panel.querySelector('[data-act="right"]').addEventListener('click', function(){ nudge(6,0); });
  panel.querySelector('[data-act="bigger"]').addEventListener('click', function(){ rescale(.05); });
  panel.querySelector('[data-act="smaller"]').addEventListener('click', function(){ rescale(-.05); });
  panel.querySelector('[data-act="wbigger"]').addEventListener('click', function(){ widthStep(12); });
  panel.querySelector('[data-act="wsmaller"]').addEventListener('click', function(){ widthStep(-12); });
  panel.querySelector('[data-act="hbigger"]').addEventListener('click', function(){ heightStep(12); });
  panel.querySelector('[data-act="hsmaller"]').addEventListener('click', function(){ heightStep(-12); });
  panel.querySelector('[data-act="fontbigger"]').addEventListener('click', function(){ fontStep(2); });
  panel.querySelector('[data-act="fontsmaller"]').addEventListener('click', function(){ fontStep(-2); });
  panel.querySelector('[data-act="reset"]').addEventListener('click', resetSel);
  panel.querySelector('[data-act="close"]').addEventListener('click', deselect);
  panel.querySelector('[data-act="export"]').addEventListener('click', exportChanges);
})();
</script>
